<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécommande CAVE</title>
    <link rel="preload" href="test_point_cloud.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="arbre_rue.glb" as="fetch" crossorigin="anonymous">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {  
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
            font-size: 16px;
        }
        input, select {
            background: #2a2a2a;
            color: white;
        }
        button {
            background: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        button.action-btn { background: #28a745; }
        button.action-btn:hover { background: #218838; }
        
        /* Style pour montrer qu'un élément est désactivé */
        button:disabled, select:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        #status {
            font-weight: bold;
            color: #ffc107;
            margin-bottom: 20px;
        }
        .slider-container {
            margin: 20px 0;
            text-align: left;
        }
        .slider-container label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: #555;
            outline: none;
            border-radius: 5px;
            padding: 0;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #007bff;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="range"]:disabled::-webkit-slider-thumb {
            background: #777;
            cursor: not-allowed;
        }
        
        /* 🌟 STYLE POUR LA ZONE DE PREVISUALISATION */
        #previewZone {
            margin-top: 15px;
            text-align: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contrôle du CAVE</h2>
        <div id="status">Statut : Déconnecté</div>

        <label for="ipInput">Adresse IP du Serveur CAVE :</label>
        <input type="text" id="ipInput" value="ws://localhost">
        <label for="portInput">Port :</label>
        <input type="text" id="portInput" value="3000">
        <button id="connectBtn">Se connecter</button>

        <hr style="border-color: #333; margin: 20px 0;">

        <h3>Actions</h3>
        <button id="flipBtn" class="action-btn" disabled>Inverser les Yeux (Flip Eyes)</button>
        
        <div class="slider-container">
            <label for="meshSelect">Sélectionner un nuage de points (.ply) :</label>
            <select id="meshSelect" disabled>
                <option value="test_point_cloud.ply" data-model="test_point_cloud.glb">Arbre d'origine</option>
                <option value="arbre_rue.ply" data-model="arbre_rue.glb">Arbre de rue</option>
            </select>

            <div id="previewZone">
                <model-viewer id="meshViewer" 
                              src="" 
                              camera-controls 
                              auto-rotate 
                              shadow-intensity="1"
                              style="width: 100%; height: 250px; background-color: #1e1e1e; border-radius: 5px; display: none;">
                </model-viewer>
                
                <button id="confirmMeshBtn" class="action-btn" style="margin-top: 10px; background: #ff8c00; display: none;" disabled>Charger cet arbre</button>
            </div>
        </div>

        <div class="slider-container">
            <label for="clipSlider">Hauteur de la Coupe :</label>
            <input type="range" id="clipSlider" min="-2" max="10" step="0.1" value="10" disabled>
        </div>

        <div class="slider-container">
            <label for="sizeSlider">Taille des points :</label>
            <input type="range" id="sizeSlider" min="0.001" max="0.5" step="0.001" value="0.1" disabled>
        </div>

    <hr style="border-color: #333; margin: 20px 0;">
        <h3>Déplacer l'arbre</h3>
        
        <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px;">
            <div id="joystickContainer" style="text-align: center; opacity: 0.5; pointer-events: none; transition: opacity 0.3s;">
                <label style="font-size: 14px; display: block; margin-bottom: 5px;">Face (X/Y)</label>                
                <div id="joystickZone" style="width: 150px; height: 150px; background: #222; border: 3px solid #444; border-radius: 50%; position: relative; touch-action: none; margin: 0 auto; box-shadow: inset 0 0 10px #000;">
                <div id="joystickCursor" style="width: 50px; height: 50px; background: #007bff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 4px 8px rgba(0,0,0,0.5);"></div>
                </div>
                <p id="joystickValues" style="font-size: 12px; color: #888; margin-top: 10px;">X: 0.00 | Y: 0.00</p>
            </div>

            <div id="joystickHeightContainer" style="text-align: center; opacity: 0.5; pointer-events: none; transition: opacity 0.3s;">
                <label style="font-size: 14px; display: block; margin-bottom: 5px;">Profondeur</label>
                <div id="joystickHeightZone" style="width: 60px; height: 150px; background: #222; border: 3px solid #444; border-radius: 30px; position: relative; touch-action: none; margin: 0 auto; box-shadow: inset 0 0 10px #000;">
                    <div id="joystickHeightCursor" style="width: 40px; height: 40px; background: #28a745; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 4px 8px rgba(0,0,0,0.5);"></div>
                </div>
                <p id="joystickHeightValue" style="font-size: 12px; color: #888; margin-top: 10px;">Z: 0.00</p>
            </div>

        </div>
    </div>

    <script type="module" src="./app.js?v=3"></script> 
</body>
</html>
